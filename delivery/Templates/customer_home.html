{% extends 'base.html' %}
{% load static %}

{% block title %}Restaurants - MealMate{% endblock %}

{% block content %}
<h1>Restaurants Near You</h1>

<div class="restaurant-grid">
    {% for r in restaurantList %}
    <div class="card">
        <img src="{{ r.picture }}" alt="{{ r.name }}" class="card-img">
        <div class="card-body">
            <h3 class="card-title">{{ r.name }}</h3>
            <p class="card-text">
                <strong>Cuisine:</strong> {{ r.cuisine }}<br>
                <strong>Rating:</strong> ⭐ {{ r.rating }}
            </p>
            <a href="{% url 'view_menu' r.id username %}" class="btn btn-primary"
                style="display: block; text-align: center;">View Menu</a>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
