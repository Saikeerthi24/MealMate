{% extends 'base.html' %}
{% load static %}

{% block title %}Add Restaurant - MealMate{% endblock %}

{% block content %}
<h1>Add New Restaurant</h1>

<form action="{% url 'add_restaurant' %}" method="post">
    {% csrf_token %}
    <label for="name">Restaurant Name:</label>
    <input type="text" id="name" name="name" required>

    <label for="picture">Picture URL:</label>
    <input type="url" id="picture" name="picture"
        value="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80">

    <label for="cuisine">Cuisine:</label>
    <input type="text" id="cuisine" name="cuisine" placeholder="e.g. Italian, Indian">

    <label for="rating">Rating (0-5):</label>
    <input type="number" id="rating" name="rating" step="0.1" min="0" max="5">

    <button type="submit" class="btn btn-primary">Add Restaurant</button>
</form>
{% endblock %}
