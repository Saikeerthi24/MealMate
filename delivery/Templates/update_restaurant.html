{% extends 'base.html' %}
{% load static %}

{% block title %}Update Restaurant - MealMate{% endblock %}

{% block content %}
<h1>Update Restaurant</h1>

<form action="{% url 'update_restaurant' restaurant.id %}" method="post">
    {% csrf_token %}
    <label for="name">Restaurant Name:</label>
    <input type="text" id="name" name="name" value="{{restaurant.name}}" required>

    <label for="picture">Picture URL:</label>
    <input type="url" id="picture" name="picture" value="{{restaurant.picture}}">

    <label for="cuisine">Cuisine:</label>
    <input type="text" id="cuisine" name="cuisine" value="{{restaurant.cuisine}}">

    <label for="rating">Rating (0-5):</label>
    <input type="number" id="rating" name="rating" step="0.1" min="0" max="5" value="{{restaurant.rating}}">

    <button type="submit" class="btn btn-primary">Update Restaurant</button>
</form>
{% endblock %}
